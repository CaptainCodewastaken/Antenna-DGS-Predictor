[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antenna-dgs-predictor"
version = "1.0.0"
description = "Physics-grounded antenna DGS predictor with ML comparison"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "joblib>=1.3",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "httpx>=0.25",
]

[tool.pytest.ini_options]
testpaths = ["backend"]
pythonpath = ["."]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/*/tests/*"]

[tool.setuptools.packages.find]
include = ["backend*"]
